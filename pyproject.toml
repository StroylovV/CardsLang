[project]
name = "cardslang"
version = "0.1.0"
description = "Project for learning languages with cards"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "StroylovV", email = "spartan9611@gmail.com"}
]
dependencies = [
    "fastapi>=0.136.0,<0.137.0",
    "uvicorn>=0.44.0,<0.45.0",
    "sqlalchemy>=2.0.49,<3.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "bcrypt>=5.0.0,<6.0.0",
    "mypy>=1.20.1,<2.0.0",
    "aiohttp>=3.13.5,<4.0.0",
    "colorama>=0.4.6,<0.5.0",
    "email-validator>=2.3.0,<3.0.0",
    "passlib>=1.7.4,<2.0.0",
    "pydantic>=2.13.2,<3.0.0",
    "python-jose>=3.5.0,<4.0.0",
    "alembic>=1.18.4,<2.0.0",
    "pydantic-settings>=2.14.0,<3.0.0",
    "psycopg2-binary>=2.9.12,<3.0.0"
]

[tool.poetry]
package-mode = false
packages = [{include = "cardslang", from = "src"}]

# ДОБАВЬТЕ ЭТОТ БЛОК:
[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
sqlalchemy = ">=2.0"
asyncpg = "^0.31.0"
bcrypt = "^5.0.0"
mypy = "^1.20.2"
aiohttp = "^3.13.5"
colorama = "^0.4.6"
email-validator = "^2.3.0"
passlib = "^1.7.4"
pydantic = "^2.13.3"
python-jose = "^3.5.0"
alembic = "^1.18.4"
pydantic-settings = "^2.14.0"
psycopg2-binary = "^2.9.12"
psycopg = {extras = ["binary"], version = "^3.3.3"}

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"