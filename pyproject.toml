[project]
name = "cardslang"
version = "0.1.0"
description = ""
authors = [
    {name = "StroylovV",email = "spartan9611@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.0,<0.137.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "bcrypt (==4.0.1)",
    "mypy (>=1.20.1,<2.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "pydantic (>=2.13.2,<3.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-multipart (>=0.0.27,<0.0.28)"
]

[tool.poetry]
packages = [{include = "cardslang", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
